<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Myanmar Culture Club (University of Toronto) — site designed & built by Naing Lin Khant (Moarz). -->
<title>Exec Area — Myanmar Culture Club</title>
<meta name="author" content="Naing Lin Khant (Moarz)">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<link rel="icon" type="image/png" href="images/brand/logo.png">
<link rel="stylesheet" href="css/exec.css">
</head>
<body data-page="exec">

<header class="nav">
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <img src="images/brand/logo.png" alt="Myanmar Culture Club logo">
      <span class="brand-name">Myanmar Culture Club<small>University of Toronto</small></span>
    </a>
    <a class="nav-link" href="index.html">Back to the site</a>
  </div>
</header>

<main class="stage">
  <span class="watermark myanmar" aria-hidden="true">မြန်မာ</span>
  <div class="wrap">
    <div class="card" id="welcome-card" hidden>
      <div class="mingalaba myanmar" aria-hidden="true">မင်္ဂလာပါ</div>
      <span class="eyebrow">Exec area</span>
      <h1 id="welcome-name">Welcome</h1>
      <span class="role-chip" id="welcome-role">exec</span>
      <p class="sub" id="welcome-sub" style="margin-top:18px"></p>
      <div class="actions">
        <a class="btn ghost" href="index.html">Back to the site</a>
        <button class="btn" id="signout-btn" type="button">Sign out</button>
      </div>
    </div>
  </div>
</main>

<footer class="slim">
  <div class="wrap">
    <div class="mark">
      <img src="images/brand/logo.png" alt="">
      <span>Myanmar Culture Club · Exec area</span>
    </div>
    <span>&copy; 2026 MCC</span>
  </div>
</footer>

<script src="js/supabase.js"></script>
<script src="js/exec-config.js"></script>
<script src="js/site.js"></script>
