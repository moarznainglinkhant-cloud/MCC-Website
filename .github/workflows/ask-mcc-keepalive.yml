# Keeps the Ask MCC server (Render free plan) awake.
# Render puts a free server to sleep after 15 minutes with no visitors, and waking it takes
# most of a minute, so the first question after a quiet spell felt broken. This pings the
# health check every 10 minutes. One always-on free service fits in Render's 750 free hours
# a month (a month is at most 744 hours), as long as no other free Render service is running.
# GitHub can delay scheduled runs at busy times, so an occasional cold start can still happen.
name: Ask MCC keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Ask MCC
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            "https://ask-mcc.onrender.com/health")
          echo "Ask MCC answered: $code"
          test "$code" -lt 500
