# Keeps the free Supabase project awake.
# Free projects pause after 7 days with no activity (quiet weeks like exams or summer).
# This makes one tiny read every 3 days, so the exec portal and event registration never wake up paused.
# The key used here is the public "publishable" key that's already in js/exec-config.js — nothing secret.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 */3 * *"   # every 3 days, ~9:17 AM Toronto time
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://teipvhyqtjwhjnqvfngi.supabase.co/rest/v1/newsletters?select=id&limit=1" \
            -H "apikey: sb_publishable_UmbrrMl_z3mDlBXdYe9Exg_ExHWMAK9")
          echo "Supabase answered: $code"
          test "$code" -lt 500
